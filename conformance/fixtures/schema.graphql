type Query {
  user(id: ID!): User
  users: [User!]!
  node(id: ID!): Node
  viewer: Viewer
}

type Mutation {
  createUser(input: CreateUserInput!): CreateUserPayload
  deleteUser(id: ID!): Boolean
  addAlert: Boolean
  # Deliberately missing a field of type Query, unlike CreateUserPayload — used by the
  # require-field-of-type-query-in-mutation-result supplemental case (see
  # conformance/supplemental-corpus.ts). Safe to add: every other corpus case that redeclares
  # `type Mutation` in its own embedded document only enables its own rule, never this one, so
  # this field is inert for them.
  renameUser(id: ID!, name: String!): RenameUserPayload
}

type Subscription {
  userUpdated: User
}

interface Node {
  id: ID!
}

input CreateUserInput {
  name: String!
}

type CreateUserPayload {
  user: User
  query: Query
}

type RenameUserPayload {
  user: User
}

type User implements Node {
  id: ID!
  name: String
  fullName: String
  email: String @deprecated(reason: "Use contact")
  friends(first: Int, after: String): UserConnection
}

type UserConnection {
  edges: [UserEdge]
  pageInfo: PageInfo!
}

type UserEdge {
  cursor: String!
  node: User
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Viewer {
  id: ID!
  user: User
}
