name: Release

on:
  push:
    branches: [main]

# Never let two release runs race each other onto the registry.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR's branch and the release commit
      pull-requests: write # open and update the "Version Packages" PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs history to work out what changed

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # tsdown needs >=22.18 or >=24.11; the build runs here
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # With pending changesets, this opens/updates a "Version Packages" PR that bumps the
      # version and writes the CHANGELOG. Once that PR is merged and no changesets remain,
      # the same job publishes instead. `pnpm release` runs the build first, and `prepack`
      # rebuilds during `npm publish`, so dist is never stale.
      - uses: changesets/action@v2
        with:
          version: pnpm exec changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
