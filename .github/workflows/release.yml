name: Release

on:
  push:
    branches: [main]

# Never let two release runs race each other onto the registry.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    permissions:
      contents: write # create the version PR's branch and the release commit
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # mint the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs history to work out what changed

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # tsdown needs >=22.18 or >=24.11; the build runs here
          cache: pnpm
      # Deliberately no `registry-url`: that makes setup-node write an .npmrc with an
      # `_authToken` line, which is pointless under trusted publishing and can break the
      # OIDC exchange when the token is empty. npm defaults to registry.npmjs.org anyway.

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm bundled with
      # some Node 24 releases. Pin it rather than depend on the runner image.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # Versioning only. With pending changesets this opens/updates a "Version Packages"
      # PR; with none pending it does nothing and the publish step below takes over.
      #
      # Publishing is deliberately NOT delegated to the action's publish-script. changesets
      # captures npm's stdout and reports only a one-line failure, which hid whether npm had
      # even attempted the OIDC exchange when the first publish returned E404. Running
      # `npm publish` directly keeps npm's own diagnostics ("OIDC is available", provenance
      # signing, the real registry error) in the log.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm exec changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm if this version is new
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "local: $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already on the registry — nothing to publish"
            exit 0
          fi
          npm --version
          # prepack rebuilds dist during publish; authentication is OIDC (no token).
          npm publish

      - name: Tag the released version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
