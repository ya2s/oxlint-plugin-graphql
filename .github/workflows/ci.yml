name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `tsdown &&` prefix here on purpose: this leg consumes the artifact the `build` job
      # already produced on Node 24 (tsdown itself needs >=22.18.0/>=24.11.0, so it must never
      # run on the 22.13 leg). `actions/download-artifact` fails the job outright if `dist` wasn't
      # uploaded, so a missing build never turns into a silent rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm vitest run tests
      - run: pnpm vitest run conformance
